<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0B0E14" />
  <rect x="40" y="40" width="1120" height="550" rx="10" fill="none" stroke="#1E2530" stroke-width="2" />
  <text x="90" y="150" fill="#C8A24A" font-family="monospace" font-size="26" letter-spacing="6">ΠΟΛΙΤΕΙΑ · ipoliteia.gr</text>
  <text x="86" y="300" fill="#ECE7DD" font-family="monospace" font-size="120" letter-spacing="20" font-weight="700">ΠΟΛΙΤΕΙΑ</text>
  <text x="90" y="380" fill="#ECE7DD" font-family="sans-serif" font-size="40">Διακυβέρνηση από σοφία, κριμένη από όλους.</text>
  <text x="90" y="470" fill="#8A93A2" font-family="sans-serif" font-size="30">Η ΤΝ προτείνει. Οι άνθρωποι αποφασίζουν. Ο λαός συλλογίζεται στο φως.</text>
  <text x="90" y="540" fill="#8A93A2" font-family="monospace" font-size="26">E = ( Σ wᵢ dᵢ^ρ )^(1/ρ)</text>
</svg>
